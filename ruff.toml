# Config ruff du world Rayman, alignée sur le ruff.toml racine d'Archipelago.
# Autonome pour fonctionner quand le dépôt est cloné seul.
line-length = 120
indent-width = 4
target-version = "py311"

[lint]
select = ["B", "C", "E", "F", "W", "I", "N", "Q", "UP", "RET", "RSE", "RUF", "ISC", "PLC", "PLE", "PLW", "T20", "PERF"]
ignore = [
    "B011",     # assert False est volontaire dans AP (retiré en build release)
    "C901",     # pas de limite de complexité (comme AP)
    "PLC0415",  # imports locaux acceptés dans AP
    "PLC1802",  # le fix change le comportement
    "PLC1901",  # pas équivalent
    "PLE1141",  # faux positifs avec des clés tuple
    "UP015",    # on garde "r" explicite dans open()
    "RUF012",   # attributs de classe mutables : pattern standard des worlds AP
]

[lint.per-file-ignores]
# Les définitions d'options AP forcent souvent des lignes longues.
"options.py" = ["E501"]
